function taskIdOf(link){const m=/task_id=(\d+)/.exec(link||"");return m?m[1]:"";}
function firstTaskId(){for(const st of Object.values(DATA.stores))for(const e of Object.values(st.wf||{})){const t=taskIdOf(e&&e.link);if(t)return t;}return "";}
// ---- Đọc dữ liệu task từ API wshr: /api/hr/projects/task-input/{id} ----
// Mỗi task WF là "vỏ cha"; các bước nằm trong data.subtasks (mỗi bước 1 task con, tên "Bx. ...").
// Vỏ cha KHÔNG tự đóng khi các bước xong -> bỏ qua status của cha, suy ra từ các bước.
// Mã status (kiểm chứng trên dữ liệu thật, xem wshr-dashboard/README):
//   0 Chưa xử lý · 1 Đang xử lý · 2 Hoàn thành · 4 Đã huỷ · 5 Đã xong (chờ ký duyệt) · 6 Chờ bên ngoài / bước máy
const T_STATUS={0:"Chưa xử lý",1:"Đang xử lý",2:"Hoàn thành",4:"Đã huỷ",5:"Xong, chờ ký",6:"Chờ bên ngoài"};
const T_DONE=new Set([2,5]),T_OPEN=new Set([0,1,6]);
const SENTINEL="2028-01-01";
const isMachineStep=x=>/^điều hướng/i.test(String(x.name||"").trim());
function realDate(v){const d=String(v||"").slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(d)&&d<SENTINEL?d:"";}
function staffOf(x){const a=x&&x.assign_to_user;const u=Array.isArray(a)?a[0]:a;return u&&(u.staff_name||u.name)||"";}
function analyzeTask(json){
  const d=json&&json.data!==undefined?json.data:json;
  if(!d||typeof d!=="object") return {ok:false,error:"response không có data"};
  const all=Array.isArray(d.subtasks)?d.subtasks:[];
  const steps=all.filter(x=>x&&!isMachineStep(x)).map(x=>({id:x.id,n:String(x.name||"").trim(),st:Number(x.status),de:realDate(x.date_end),fa:String(x.finished_at||"").slice(0,16),pic:staffOf(x)})).sort((a,b)=>a.id-b.id);
  return {ok:true,id:d.id,name:d.name||"",parentId:Number(d.parent_id)||0,wfId:d.workflow_id||null,steps,
    done:steps.filter(x=>T_DONE.has(x.st)),open:steps.filter(x=>T_OPEN.has(x.st)),cancelled:steps.filter(x=>x.st===4)};
}
// Tính kết quả cho 1 WF từ các bước trên hệ thống task.
// % = mức % (danh mục bước) của bước đang mở xa nhất; không bước nào đang mở mà có bước xong = 100%.
// Bước không có trong danh mục -> % = số bước xong / số bước đã phát sinh (bỏ bước huỷ).
function wfFromTask(wf,a){
  const pctOf=x=>{const m=matchStepStrict(wf,x.n);return m?{m,p:Number(m.p)||0}:null;};
  const counted=a.done.length+a.open.length;
  const ratio=counted?Math.round(a.done.length/counted*100):0;
  const r={taskTotal:counted,taskDone:a.done.length,taskOpen:a.open.length,taskSteps:a.steps.slice(-30)};
  if(a.open.length){
    const om=a.open.map(x=>({x,k:pctOf(x)}));
    const best=om.filter(o=>o.k).sort((u,v)=>v.k.p-u.k.p||v.x.id-u.x.id)[0];
    const doneMax=Math.max(0,...a.done.map(x=>{const k=pctOf(x);return k?k.p:0;}));
    const cur=best?best.x:a.open[a.open.length-1];
    r.status=a.open.every(x=>x.st===6)?"Đang thực hiện":"Đang thực hiện";
    r.step=best?best.k.m.n:"";
    r.taskStep=a.open.map(x=>x.n).join(" · ");
    r.taskPct=best?Math.max(best.k.p,doneMax):ratio;
    if(r.taskPct>=100) r.taskPct=99;
    r.deadline=cur.de||"";
    r.taskPic=cur.pic||"";
  }else if(a.done.length){
    const last=a.done[a.done.length-1],k=pctOf(last);
    r.status="Hoàn thành";r.step=k?k.m.n:"";r.taskStep=last.n;r.taskPct=100;r.deadline="";r.taskPic="";
  }else if(a.cancelled.length){
    r.status="Tạm dừng / vướng";r.step="";r.taskStep="Các bước đã bị huỷ";r.taskPct=0;r.taskPic="";
  }else{
    r.status="Đang thực hiện";r.step="";r.taskStep="Chưa phát sinh bước nào";r.taskPct=0;r.taskPic="";
  }
  return r;
}
// Khớp tên bước từ hệ thống với danh mục: trùng tên, hoặc cùng mã Bx và trùng phần đầu nội dung.
// Không khớp chỉ theo mã (tránh lấy nhầm % của bước khác cùng mã).
function matchStepStrict(wf,name){
  if(!name) return null; const n=normS(name);
  const ex=wf.steps.find(x=>normS(x.n)===n); if(ex) return ex;
  const code=stepCode(name), body=n.replace(/^b\.?\s*[\d.]+\.?\s*(\(\*\))?\.?\s*/,"").replace(/\s*\(\*\)\s*$/,"");
  if(!code||!body) return null;
  return wf.steps.find(x=>{if(stepCode(x.n)!==code)return false;const xb=normS(x.n).replace(/^b\.?\s*[\d.]+\.?\s*(\(\*\))?\.?\s*/,"").replace(/\s*\(\*\)\s*$/,"");return xb===body||xb.startsWith(body.slice(0,15))||body.startsWith(xb.slice(0,15));})||null;
}
function taskStepsHtml(e){
  if(!e.syncedAt||!Array.isArray(e.taskSteps)||!e.taskSteps.length) return "";
  const k=st=>T_DONE.has(st)?"ok":st===4?"na":st===6?"hold":st===1?"run":"todo";
  return `<div class="tsteps"><div class="h"><span>Các bước trên hệ thống task</span><span>${e.taskDone||0}/${e.taskTotal||0} bước xong · đọc lúc ${String(e.syncedAt).slice(11,16)} ${fd(String(e.syncedAt).slice(0,10))}</span></div>
    ${e.taskSteps.map(x=>`<div class="tstep">${stIcon(k(x.st))}<div class="nm2">${esc(x.n)}${x.pic?`<div class="sm2">${esc(x.pic)}</div>`:""}</div><span class="d">${x.fa?"xong "+fd(x.fa.slice(0,10)):x.de?"hạn "+fd(x.de):""}</span>${pill(k(x.st),T_STATUS[x.st]||("Mã "+x.st))}</div>`).join("")}</div>`;
}
// Kiểm tra token: wshr chỉ nhận token app="wshr" và sub khác 0.
function tokenInfo(t){
  try{const p=JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))));
    const warn=[];if(p.app&&p.app!=="wshr")warn.push(`token có app="${p.app}" — API wshr chỉ nhận app="wshr"`);
    if(p.sub===0||p.sub==="0")warn.push("token có sub=0 — API từ chối, cần token của một nhân viên thật");
    if(p.exp&&p.exp*1000<Date.now())warn.push("token đã hết hạn");
    return {app:p.app||"?",sub:p.sub,exp:p.exp?new Date(p.exp*1000):null,warn};
  }catch(e){return {warn:["token không đúng dạng JWT"]};}
}
class ApiError extends Error{constructor(kind,msg){super(msg);this.kind=kind;}}
async function fetchTaskRaw(id){
  let r;
  try{r=await fetch(SET.apiBase.replace(/\/+$/,"")+"/"+encodeURIComponent(id),{headers:{accept:"application/json","x-locale":"vi",authorization:"Bearer "+SET.token}});}
  catch(e){throw new ApiError("cors","Trình duyệt chặn gọi API (CORS) hoặc không có mạng tới wshr.hasaki.vn.");}
  const text=await r.text();let j=null;try{j=JSON.parse(text);}catch(e){}
  if(r.status===401||r.status===403) throw new ApiError("auth","Token không hợp lệ hoặc hết hạn (HTTP "+r.status+").");
  return {status:r.status,json:j,text};
}
const CORS_HELP="API wshr.hasaki.vn chỉ cho phép trang work.hasaki.vn gọi trực tiếp. Cách xử lý: nhờ team backend thêm nguồn gọi của trang này vào CORS của API (khi mở file HTML trên máy, nguồn gọi là “null”; nếu đặt trang trên một tên miền nội bộ thì thêm tên miền đó), hoặc dùng bản tien-do-thi-cong.exe.";
async function testApi(id){
  S.testTid=id;
  if(STORE.mode==="sheet"){
    if(!/^\d{3,12}$/.test(id)){toast("Nhập task_id (chỉ gồm số) để thử.",true);return;}
    S.testResult={head:"đang gọi qua máy chủ Google…",body:""};render();
    try{const r=await sheetPost({action:"test",taskId:id});const a=r.status===200&&r.json?analyzeTask(r.json):null;
      const lines=a&&a.ok?a.steps.map(x=>`${T_STATUS[x.st]||("Mã "+x.st)}  |  ${x.n}${x.pic?"  |  "+x.pic:""}${x.de?"  |  hạn "+x.de:""}`).join("\n"):"";
      S.testResult={head:"HTTP "+r.status+(a&&a.ok?` · ${a.steps.length} bước (${a.done.length} xong, ${a.open.length} đang mở)`:""),body:(lines?lines+"\n\n---- JSON gốc ----\n":"")+(r.json?JSON.stringify(r.json,null,2):r.text||"").slice(0,6000)};}
    catch(e){S.testResult={head:"lỗi",body:e.message};}
    render();return;
  }
  if(!SET.token){toast("Nhập token API rồi bấm “Lưu kết nối” trước.",true);return;}
  if(!/^\d{3,12}$/.test(id)){toast("Nhập task_id (chỉ gồm số) để thử.",true);return;}
  S.testResult={head:"đang gọi…",body:""};render();
  try{const r=await fetchTaskRaw(id);const a=r.status===200&&r.json?analyzeTask(r.json):null;
    const sum=a&&a.ok?` · ${a.steps.length} bước (${a.done.length} xong, ${a.open.length} đang mở${a.cancelled.length?", "+a.cancelled.length+" huỷ":""})${a.open.length?" · đang ở: "+a.open.map(x=>x.n).join(" · "):""}${!a.steps.length&&a.parentId?" · đây là bước con, task cha: "+a.parentId:""}`:"";
    const lines=a&&a.ok?a.steps.map(x=>`${T_STATUS[x.st]||("Mã "+x.st)}  |  ${x.n}${x.pic?"  |  "+x.pic:""}${x.de?"  |  hạn "+x.de:""}`).join("\n"):"";
    S.testResult={head:"HTTP "+r.status+sum,body:(lines?lines+"\n\n---- JSON gốc ----\n":"")+(r.json?JSON.stringify(r.json,null,2):r.text).slice(0,6000)};}
  catch(e){S.testResult={head:"lỗi",body:e.message+(e.kind==="cors"?"\n\n"+CORS_HELP:"")};}
  render();
}
const normS=x=>String(x||"").toLowerCase().normalize("NFC").replace(/\s+/g," ").trim();
function matchStep(wf,name){
  if(!name) return null; const n=normS(name);
  let s=wf.steps.find(x=>normS(x.n)===n); if(s) return s;
  const code=stepCode(name); const body=n.replace(/^b\.?\s*[\d.]+\.?\s*/,"");
  if(code){const c=wf.steps.filter(x=>stepCode(x.n)===code);if(c.length===1)return c[0];s=c.find(x=>body&&normS(x.n).includes(body.slice(0,20)));if(s)return s;}
  return wf.steps.find(x=>body&&normS(x.n).includes(body))||null;
}
function mapStatus(t){const v=normS(t);
  if(/hoàn thành|đã xong|completed|done|finish|đã đóng|closed/.test(v)) return "Hoàn thành";
  if(/tạm dừng|tạm hoãn|pause|hold|vướng|từ chối|reject|huỷ|hủy|cancel/.test(v)) return "Tạm dừng / vướng";
  return "Đang thực hiện";}
async function loadTask(id){
  // Link có thể trỏ tới 1 bước con -> tự lấy task cha để đọc đủ các bước.
  let r=await fetchTaskRaw(id);
  if(r.status!==200||!r.json) return {ok:false,error:"HTTP "+r.status};
  let a=analyzeTask(r.json);
  if(a.ok&&!a.steps.length&&a.parentId){const r2=await fetchTaskRaw(String(a.parentId));if(r2.status===200&&r2.json){const a2=analyzeTask(r2.json);if(a2.ok)a=a2;}}
  return a;
}
async function syncStores(ids,auto){
  if(STORE.mode==="sheet"){
    if(S.syncing||!STORE.serverSync) return;
    if(STORE.queue.length) await flushSheet();
    S.syncing=true;render();
    try{const j=await sheetPost({action:"sync",storeIds:ids||[],by:S.me||""});DATA=fromServer(j);toState();persistLocal();const x=j.summary||{};
      if(!x.tasks) toast((ids||[]).length===1?"Chưa có link task nào trong phần B. Dán link work.hasaki.vn vào ô Link task của từng WF.":"Chưa có link task nào để đồng bộ.",true);
      else toast(`Đã đồng bộ ${x.ok}/${x.tasks} task · ${x.changed} WF thay đổi`+(x.unmatched?` · ${x.unmatched} bước chưa có trong danh mục`:"")+(x.failed?` · ${x.failed} task lỗi`:""),x.ok===0);}
    catch(e){toast("Không đồng bộ được: "+e.message,true);}
    S.syncing=false;render();return;
  }
  if(S.syncing||!SET.token) return;
  const c=cfg(),pairs=[],want=new Set(ids||[]);
  Object.values(DATA.stores).forEach(st=>{if((want.size&&!want.has(st.id))||st.hold)return;c.workflows.forEach(w=>{const e=(st.wf||{})[w.id]||{};if(e.status==="Không áp dụng")return;const tid=taskIdOf(e.link);if(tid)pairs.push({sid:st.id,w,tid,e});});});
  if(!pairs.length){if(!auto)toast(want.size===1?"Chưa có link task nào trong phần B. Dán link work.hasaki.vn vào ô Link task của từng WF.":"Chưa có link task nào để đồng bộ.",true);return;}
  S.syncing=true;render();
  const uniq=[...new Set(pairs.map(p=>p.tid))],got={};let fatal=null;
  for(let i=0;i<uniq.length&&!fatal;i+=6){
    await Promise.all(uniq.slice(i,i+6).map(async id=>{
      try{got[id]=await loadTask(id);}
      catch(e){if(e.kind==="cors"||e.kind==="auth")fatal=e;got[id]={ok:false,error:e.message};}
    }));
  }
  S.syncing=false;
  if(fatal){render();toast("Không đồng bộ được: "+fatal.message+(fatal.kind==="cors"?" Xem hướng dẫn ở trang Cấu hình → “Thử gọi API”.":""),true);return;}
  const stamp=now(),T=today(),patches={},sum={tasks:pairs.length,ok:0,failed:0,changed:0,unmatched:0,errors:[]};
  pairs.forEach(p=>{
    const a=got[p.tid];if(!a||!a.ok){sum.failed++;if(sum.errors.length<5)sum.errors.push("task "+p.tid+": "+(a?a.error:"không có dữ liệu"));return;}
    sum.ok++;const r=wfFromTask(p.w,a);
    const wp={status:r.status,taskPct:r.taskPct,taskStep:r.taskStep||"",taskDone:r.taskDone,taskOpen:r.taskOpen,taskTotal:r.taskTotal,taskSteps:r.taskSteps,syncedAt:stamp,updated:T};
    if(r.step) wp.step=r.step; else if(r.taskOpen) sum.unmatched++;
    if(r.deadline) wp.deadline=r.deadline;
    if(r.taskPic) wp.pic=r.taskPic;
    const oldP=Number(p.e.taskPct);
    if(wp.status!==p.e.status||(wp.step&&wp.step!==p.e.step)||r.taskPct!==oldP||(wp.deadline&&wp.deadline!==p.e.deadline))sum.changed++;
    (patches[p.sid]=patches[p.sid]||{wf:{},wfSyncedAt:stamp}).wf[p.w.id]=wp;
  });
  commit({t:"sync",patches,lastSync:{at:stamp,by:auto?"tự động":(S.me||""),summary:sum}},true);
  if(!auto||sum.failed) toast(`Đã đồng bộ ${sum.ok}/${sum.tasks} task · ${sum.changed} WF thay đổi % / bước`+(sum.unmatched?` · ${sum.unmatched} bước chưa có trong danh mục (% tính theo số bước xong)`:"")+(sum.failed?` · ${sum.failed} task lỗi`:""),sum.ok===0);
}

/* ---------- routing ---------- */
function route(){
  const h=location.hash.replace("#","");
  S.confirmDel=false;
  if(h.startsWith("cn-")){S.view="cn";S.storeId=h.slice(3);}
  else if(["viec-can-xu-ly","lich","cau-hinh"].includes(h)) S.view=h;
  else S.view="tong-quan";
  if(S.view!=="cau-hinh") S.cfgDraft=null;
  render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{const a=e.target.closest("[data-act-filter]");if(a)S.actFilter=a.dataset.actFilter;},true);

/* ---------- boot ---------- */
function setSync(k,t){["sync","sync2"].forEach(id=>{const s=document.getElementById(id);s.className="sync "+k;s.lastElementChild.textContent=t;});}
let pending=false,ptrDown=false,want=false;
function schedule(){if(ptrDown){want=true;return;}if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;if(ptrDown){want=true;return;}render();});}
document.addEventListener("pointerdown",()=>{ptrDown=true;},true);
function release(){if(!ptrDown)return;setTimeout(()=>{ptrDown=false;if(want){want=false;render();}},0);}
document.addEventListener("pointerup",release,true);document.addEventListener("pointercancel",release,true);
function renderMe(){const b=document.getElementById("meBtn");if(b)b.textContent=S.me?"Bạn: "+S.me+" · đổi":"Nhập tên của bạn";}
document.getElementById("meBtn").addEventListener("click",()=>{S.askName=true;location.hash="tong-quan";render();setTimeout(()=>{const i=document.getElementById("meIn");if(i)i.focus();},50);});
async function boot(){
  try{S.me=localStorage.getItem("tdtc-me")||"";}catch(e){}
  S.isAdmin=true;S.canWrite=true;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(LS_DATA)||"null");}catch(e){}
  DATA=normData(saved||clone(SEED));if(!saved)persistLocal();
  toState();
  document.getElementById("todayLbl").textContent=longToday();
  renderMe();route();setSync("live","Lưu trên trình duyệt");
  if(SET.mode==="file"){
    const h=await kvGet("handle");
    if(h){STORE.handle=h;STORE.mode="file";STORE.name=h.name;
      try{if((await h.queryPermission({mode:"readwrite"}))==="granted"){const d=await readFile();if(d){DATA=d;toState();persistLocal();}setSync("live","Đã đọc file "+hm());}else STORE.needPerm=true;}
      catch(e){STORE.needPerm=true;}
    }else{SET.mode="local";saveSet();}
  }
  if(sheetApi()) await connectSheet();
  render();
  setInterval(()=>{STORE.mode==="sheet"?pollSheet():pollFile();},15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)(STORE.mode==="sheet"?pollSheet():pollFile());});
  setInterval(()=>{const m=Number(SET.autoMin)||0;if(STORE.mode==="sheet"||!SET.token||!m||document.hidden||S.syncing)return;const at=DATA.lastSync&&DATA.lastSync.at;
    if(!at||(Date.now()-new Date(at).getTime())/60000>=m)syncStores([],true);},60000);
}
boot();
