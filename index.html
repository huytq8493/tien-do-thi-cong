<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Tiến độ thi công chi nhánh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — dark-green sidebar (desktop) / bottom tab bar (phone); content column max 1240px.
   Overview: KPI row → [Sắp khai trương | Cần xử lý] → store cards → matrix. Detail: header + milestone stepper → A → B → nhật ký. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --raised:#FFFFFF; --sunk:#EDF1EF; --track:#E3E9E6;
  --ink:#14201A; --ink-2:#3B4842; --muted:#6A7771; --line:#E1E7E4; --line-2:#CBD4CF;
  --brand:#0F3D2A; --brand-ink:#E9F4EE; --brand-muted:#9CC0AE; --brand-hi:#1B5A3F;
  --accent:#17855A; --accent-ink:#FFFFFF; --accent-soft:#E2F2EA; --accent-line:#A9D8C1;
  --late:#C23B2E; --late-soft:#FCEBE8; --soon:#B26B00; --soon-soft:#FDF2DD; --run:#2D63C8; --run-soft:#E7EEFB;
  --ok:#17855A; --ok-soft:#E2F2EA; --hold:#7B4DC2; --hold-soft:#F0E9FA; --na:#8E9993; --na-soft:#F0F2F1;
  --shadow-sm:0 1px 2px rgba(16,40,28,.06); --shadow:0 1px 2px rgba(16,40,28,.05),0 4px 14px -4px rgba(16,40,28,.08);
  --r:14px; --r-sm:9px;
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1210; --surface:#141C18; --raised:#18221D; --sunk:#101814; --track:#25302B;
  --ink:#E7EEEA; --ink-2:#C3CEC8; --muted:#8E9C95; --line:#232E29; --line-2:#34413A;
  --brand:#08160F; --brand-ink:#E3F0E9; --brand-muted:#7FA592; --brand-hi:#123224;
  --accent:#45B985; --accent-ink:#06120C; --accent-soft:#163327; --accent-line:#2B6B4C;
  --late:#F08072; --late-soft:#3A1D19; --soon:#EDB352; --soon-soft:#37290F; --run:#86AEF2; --run-soft:#1A2843;
  --ok:#45B985; --ok-soft:#163327; --hold:#BC9BEB; --hold-soft:#2A2040; --na:#7A8780; --na-soft:#1B2420;
  --shadow-sm:none; --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#141C18; --raised:#18221D; --sunk:#101814; --track:#25302B;
  --ink:#E7EEEA; --ink-2:#C3CEC8; --muted:#8E9C95; --line:#232E29; --line-2:#34413A;
  --brand:#08160F; --brand-ink:#E3F0E9; --brand-muted:#7FA592; --brand-hi:#123224;
  --accent:#45B985; --accent-ink:#06120C; --accent-soft:#163327; --accent-line:#2B6B4C;
  --late:#F08072; --late-soft:#3A1D19; --soon:#EDB352; --soon-soft:#37290F; --run:#86AEF2; --run-soft:#1A2843;
  --ok:#45B985; --ok-soft:#163327; --hold:#BC9BEB; --hold-soft:#2A2040; --na:#7A8780; --na-soft:#1B2420;
  --shadow-sm:none; --shadow:0 1px 0 rgba(255,255,255,.02); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;padding:18px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));gap:6px}
.logo{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#2FA672,#13704A);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.03em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.logo b{display:block;font-size:14.5px;line-height:1.25;font-weight:600}
.logo small{display:block;font-size:11.5px;color:var(--brand-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--brand-muted);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--brand-ink)}
.nav a[aria-current="page"]{background:var(--brand-hi);color:#fff}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--brand-ink)}
.nav .cnt.hot{background:#E2574A;color:#fff}
.side .add{margin:14px 0 6px;justify-content:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--brand-muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:#7C8A83;flex:none}
.sync.live i{background:#4CD08F;box-shadow:0 0 0 3px rgba(76,208,143,.18)} .sync.off i{background:#E2574A}
.today-lbl{font-size:12px;color:var(--brand-muted)}

.mtop{display:none}
.tabbar{display:none}
.content{min-width:0;padding:26px max(28px,env(safe-area-inset-right,0px)) 70px 28px}
.page{max-width:1240px;margin:0 auto}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);align-items:center;gap:10px;
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .mtop .logo{padding:0;flex:1;min-width:0}.mtop .logo-mark{width:30px;height:30px;font-size:11.5px}
  .mtop .sync span{display:none}
  .content{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:5px 2px;border-radius:9px;position:relative;font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar svg.i{width:22px;height:22px}
  .tabbar .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--late);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:8px 13px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost-dark{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#fff}
.btn.ghost-dark:hover{background:rgba(255,255,255,.12)}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
.in:hover{border-color:color-mix(in srgb,var(--line-2) 60%,var(--ink))}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:72px;line-height:1.5}
.in[readonly],.in:disabled{background:var(--sunk);cursor:default}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500}

/* ---------- page heading ---------- */
.ph{display:flex;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:16px;margin:0;font-weight:600}
.sec-h .sub{color:var(--muted);font-size:13px}
.sec-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;font-size:13.5px}
.tip b{display:block;margin-bottom:2px}
.tip button{margin-left:auto;flex:none}
@media (max-width:600px){.tip{flex-wrap:wrap}.tip>div{flex:1 1 220px}}
.banner{padding:12px 14px;border-radius:var(--r-sm);background:var(--soon-soft);border:1px solid var(--soon);margin-bottom:16px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--sunk),var(--track),var(--sunk));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px 18px;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;min-width:0}
a.kpi:hover{border-color:var(--line-2)}
.kpi .t{min-width:0;flex:1}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-top:2px}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .ic svg.i{width:21px;height:21px}
.ic.g{background:var(--accent-soft);color:var(--accent)} .ic.r{background:var(--late-soft);color:var(--late)} .ic.y{background:var(--soon-soft);color:var(--soon)} .ic.b{background:var(--run-soft);color:var(--run)}
.kpi.alert .v{color:var(--late)}
@media (max-width:520px){.kpi{padding:13px 14px;gap:10px;align-items:flex-start}.kpi .v{font-size:24px}.kpi .ic,.kpi .ringw{display:none}.up li{grid-template-columns:52px minmax(0,1fr) 64px}.hero-mini div{padding:10px 14px}}

/* ring */
.ringw{position:relative;display:inline-grid;place-items:center;flex:none}
.ringw b{position:absolute;font-weight:700;font-size:12px;letter-spacing:-.01em}
.ringw.lg b{font-size:22px}
.ring circle{transition:stroke-dashoffset .5s ease}

/* two-col */
.duo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:1000px){.duo{grid-template-columns:1fr}}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.panel-h h3{margin:0;font-size:14.5px;font-weight:600}
.panel-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel-h a{font-size:13px;text-decoration:none;font-weight:500}
.list{list-style:none;margin:0;padding:0 6px 8px}
.list li{display:grid;align-items:center;gap:12px;padding:10px 10px;border-radius:10px;cursor:pointer}
.list li:hover{background:var(--sunk)}
.up li{grid-template-columns:58px minmax(0,1fr) 120px}
.up .cd{text-align:center;border-radius:10px;padding:6px 0;background:var(--sunk)}
.up .cd b{display:block;font-size:17px;line-height:1.1;font-weight:700}
.up .cd span{font-size:10.5px;color:var(--muted);font-weight:500}
.up .cd.late{background:var(--late-soft);color:var(--late)} .up .cd.late span{color:var(--late)}
.up .cd.soon{background:var(--soon-soft);color:var(--soon)} .up .cd.soon span{color:var(--soon)}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.todo li{grid-template-columns:auto minmax(0,1fr) auto}
.todo .sev{width:9px;height:9px;border-radius:50%}
.sev.late{background:var(--late)} .sev.soon{background:var(--soon)} .sev.notask,.sev.hold{background:var(--hold)}
.todo .due{font-size:12.5px;font-weight:600;text-align:right;white-space:nowrap}
.todo .due.late{color:var(--late)} .todo .due.soon{color:var(--soon)} .todo .due.notask,.todo .due.hold{color:var(--hold)}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--na-soft);color:var(--muted);line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.run{background:var(--run-soft);color:var(--run)}
.pill.late{background:var(--late-soft);color:var(--late)} .pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.na{background:var(--na-soft);color:var(--na)} .pill.notask,.pill.hold{background:var(--hold-soft);color:var(--hold)}
.pill.blank,.pill.todo{background:var(--na-soft);color:var(--muted)}

/* filters */
.seg-f{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg-f button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg-f button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:600}
.seg-f .c{margin-left:5px;font-size:11.5px;color:var(--muted);font-weight:500}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.search input{padding-left:34px;width:240px;max-width:100%;border-radius:10px}
@media (max-width:600px){.search,.search input{width:100%}}

/* ---------- store cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:14px;padding:16px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,transform .15s,box-shadow .15s;position:relative}
.card:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:0 8px 24px -10px rgba(16,40,28,.18)}
.card.is-late::after{content:"";position:absolute;left:-1px;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--late)}
.c-top{display:flex;gap:12px;align-items:flex-start}
.c-top .t{flex:1;min-width:0}
.c-top h3{font-size:15px;margin:0;font-weight:600;line-height:1.35;text-wrap:balance}
.c-top .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.c-mid{display:flex;align-items:center;gap:14px}
.c-mid .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.c-pills{display:flex;gap:6px;flex-wrap:wrap}
.phase{font-size:13px;color:var(--ink-2)}
.c-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.c-note{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-note b{color:var(--ink-2);font-weight:600}
.dots{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.dots .g{font-size:10.5px;font-weight:700;color:var(--muted);margin-right:3px}
.dots .gap{width:10px}
.dots i{width:11px;height:11px;border-radius:3px;background:var(--track)}
.dots i.ok{background:var(--ok)} .dots i.run{background:var(--run)} .dots i.late{background:var(--late)} .dots i.soon{background:var(--soon)}
.dots i.notask,.dots i.hold{background:var(--hold)} .dots i.na{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)} .dots i.blank,.dots i.todo{background:var(--track)}

.cdb{flex:none;text-align:right}
.cdb b{display:block;font-size:20px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.cdb span{font-size:11.5px;color:var(--muted)}
.cdb.late b{color:var(--late)} .cdb.soon b{color:var(--soon)} .cdb.ok b{color:var(--ok)}

/* milestone stepper */
.steps{display:grid;grid-template-columns:repeat(2,1fr);position:relative}
.steps .s{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;position:relative;min-width:0}
.steps .s::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--track)}
.steps .s:first-child::before{display:none}
.steps .s.done::before,.steps .s.cur::before{background:var(--accent)}
.steps .n{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);position:relative;z-index:1}
.steps .s.done .n{background:var(--accent);border-color:var(--accent)}
.steps .s.cur .n{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps .k{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
.steps .d{font-size:11.5px;font-weight:600;white-space:nowrap}
.steps .d.none{color:var(--muted);font-weight:400}
.steps.big .n{width:18px;height:18px}
.steps.big .s::before{top:8px}
.steps.big .k{font-size:12.5px}
.steps.big .in{text-align:center;padding:6px 6px;max-width:150px;font-size:13px}
@media (max-width:600px){.steps.big .in{font-size:12px;padding:6px 2px}}

/* ---------- tables ---------- */
.tbl{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk)}
thead th:first-child{border-top-left-radius:var(--r)} thead th:last-child{border-top-right-radius:var(--r)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
th:first-child{background:var(--sunk)}
tbody tr:hover td{background:var(--sunk)}

/* ---------- actions view ---------- */
.act-list{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:136px minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,.9fr) 110px;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}

/* ---------- timeline ---------- */
.tl{overflow-x:auto}
.tl-inner{min-width:900px;position:relative}
.tl-row{display:grid;grid-template-columns:250px 1fr;border-bottom:1px solid var(--line);min-height:52px}

.tl-label{padding:9px 14px;font-size:13px;font-weight:600;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;cursor:pointer;min-width:0;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}

.tl-label span{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative}
.tl-head{min-height:38px;background:var(--sunk)}
.tl-tick{position:absolute;top:0;bottom:0;font-size:11.5px;color:var(--muted);padding:10px 0 0 6px;white-space:nowrap;border-left:1px solid var(--line)}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.7}
.tl-bar{position:absolute;top:18px;height:16px;border-radius:5px}
.tl-bar.prep{background:repeating-linear-gradient(-45deg,var(--sunk) 0 5px,var(--track) 5px 10px);border:1px solid var(--line-2)}
.tl-bar.build{background:var(--run-soft);border:1px solid color-mix(in srgb,var(--run) 45%,transparent);overflow:hidden}
.tl-bar.build>i{position:absolute;inset:0 auto 0 0;background:var(--run);opacity:.75}
.tl-kt{position:absolute;top:17px;width:18px;height:18px;margin-left:-9px;z-index:3;display:grid;place-items:center}
.tl-kt::before{content:"";width:12px;height:12px;transform:rotate(45deg);background:var(--accent);border:2px solid var(--surface);border-radius:2px;box-shadow:0 0 0 1px var(--accent)}
.tl-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--late);z-index:2}
.tl-today b{position:absolute;top:8px;left:5px;font-size:11px;color:#fff;background:var(--late);padding:1px 6px;border-radius:5px;white-space:nowrap}

/* ---------- detail ---------- */

.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:4px;margin:22px 0 0;padding:8px 0;background:var(--bg);overflow-x:auto;scrollbar-width:none}

.warn{text-align:right}

const ic=(n,cls)=>`<svg class="i ${cls||""}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const S={db:null,user:null,dl:null,uid:null,canWrite:true,isAdmin:false,config:null,stores:{},logs:[],
  ready:{config:false,stores:false,logs:false},failed:false,view:"tong-quan",storeId:null,
  filter:"dang",q:"",open:new Set(),actFilter:"all",actPic:"",confirmDel:false,cfgDraft:null,tipHidden:false};

/* ---------- helpers ---------- */
const DAY=86400000;
const p2=n=>String(n).padStart(2,"0");
function today(){const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function toT(s){if(!s)return null;const a=s.split("-").map(Number);return Date.UTC(a[0],a[1]-1,a[2]);}
function diff(a,b){return Math.round((toT(a)-toT(b))/DAY);}
function addDays(s,n){return new Date(toT(s)+n*DAY).toISOString().slice(0,10);}
function fd(s){if(!s)return "";const a=s.split("-");return a[2]+"/"+a[1];}
function fdy(s){if(!s)return "";const a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0];}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function pct(x){return Math.round(x*100)+"%";}
function stepCode(n){const m=/^B\.?\s*(\d+(?:\.\d+)*)/.exec(n||"");return m?"B"+m[1]:"";}
function shortWf(n){return n.replace(/^WF (thi công |lắp đặt )?/i,"").replace(/^./,c=>c.toUpperCase());}
function firstUrl(s){const m=/https?:\/\/[^\s,]+/.exec(s||"");return m?m[0]:"";}
function cfg(){return S.config||DEFAULT_CONFIG;}
const WD=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
function longToday(){const d=new Date();return WD[d.getDay()]+", "+p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear();}
function ring(p,size,stroke,label,cls){const r=(size-stroke)/2,c=2*Math.PI*r,col=p>=1?"var(--ok)":"var(--accent)";
  return `<span class="ringw ${cls||""}"><svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-Math.max(0,Math.min(1,p)))).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><b>${label}</b></span>`;}

/* ---------- calculations (giữ đúng quy tắc file Excel v13) ---------- */
function calc(st){
  const T=today(), c=cfg();
  const opened=!!st.openDate&&st.openDate<=T;
  const man=c.manual.map(it=>{
    const e=(st.manual||{})[it.id]||{}; const s=e.status||"";
    const dl=st.openDate?addDays(st.openDate,-Number(it.offset||0)):"";
    let w;
    if(s==="Không A/D") w={k:"na",t:"Không áp dụng"};
    else if(s==="Đã xong") w={k:"ok",t:"Hoàn tất"};
    else if(opened&&!s) w={k:"na",t:"Không tính (đã KT)"};
    else if(!s) w={k:"blank",t:"Chưa cập nhật"};
    else if(dl&&diff(T,dl)>0) w={k:"late",t:"Trễ "+diff(T,dl)+" ngày",d:diff(T,dl)};
    else if(dl&&diff(T,dl)>=-3) w={k:"soon",t:diff(T,dl)===0?"Đến hạn hôm nay":"Còn "+(-diff(T,dl))+" ngày"};
    else w={k:s==="Đang làm"?"run":"todo",t:s};
    return {it,e,s,dl,w,app:s!=="Không A/D"&&!(opened&&!s),done:s==="Đã xong"};
  });
  const wfs=c.workflows.map(wf=>{
    const e=(st.wf||{})[wf.id]||{}; const s=e.status||"";
    const step=wf.steps.find(x=>x.n===e.step)||null;
    const fromTask=e.taskPct!=null&&e.taskPct!==""&&!!e.syncedAt&&s!=="Không áp dụng";
    const p=s==="Hoàn thành"?100:fromTask?Math.max(0,Math.min(100,Number(e.taskPct)||0)):(s==="Đang thực hiện"||s==="Tạm dừng / vướng")?(step?Number(step.p)||0:0):0;
    const dd=e.deadline?diff(T,e.deadline):null;
    let w;
    if(s==="Hoàn thành") w={k:"ok",t:"Hoàn thành"};
    else if(s==="Không áp dụng") w={k:"na",t:"Không áp dụng"};
    else if(s==="Chưa tạo task") w={k:"notask",t:"Chưa tạo task"};
    else if(!s) w={k:"blank",t:"Chưa cập nhật"};
    else if(dd!==null&&dd>0) w={k:"late",t:"Trễ "+dd+" ngày",d:dd};
    else if(s==="Tạm dừng / vướng") w={k:"hold",t:"Tạm dừng / vướng"};
    else if(dd!==null&&dd>=-3) w={k:"soon",t:dd===0?"Đến hạn hôm nay":"Còn "+(-dd)+" ngày"};
    else w={k:"run",t:"Đang thực hiện"};
    return {wf,e,s,step,p,w,fromTask,app:s!=="Không áp dụng",code:stepCode(e.step)};
  });
  const mApp=man.filter(x=>x.app), mDone=mApp.filter(x=>x.done).length;
  const wApp=wfs.filter(x=>x.app), wSum=wApp.reduce((a,x)=>a+x.p,0);
  const denom=mApp.length+wApp.length;
  const prog=denom?(mDone+wSum/100)/denom:0;
  const plan=calcPlan(st);
  // Chi nhánh đã khai trương mà chưa từng cập nhật phần C thì không báo trễ (tránh dồn cảnh báo cho dữ liệu cũ).
  const planOn=!!plan&&!st.hold&&(!opened||plan.touched);
  const late=man.filter(x=>x.w.k==="late").length+wfs.filter(x=>x.w.k==="late").length+(planOn?plan.late:0);
  const soon=man.filter(x=>x.w.k==="soon").length+wfs.filter(x=>x.w.k==="soon").length+(planOn?plan.soon:0);
  let status,sk;
  if(st.hold){status="Tạm hoãn";sk="hold";}
  else if(!st.openDate){status="Chưa có lịch";sk="blank";}
  else if(opened){status="Đã khai trương";sk="ok";}
  else{status="Đang triển khai";sk="run";}
  const dKT=st.openDate?diff(st.openDate,T):null;
  let phase;
  if(opened) phase="Đã khai trương · còn tồn "+Math.round((1-prog)*100)+"%";
  else if(st.buildStart&&st.buildStart<=T){
    phase="Đang thi công · ngày "+(diff(T,st.buildStart)+1)+(st.openDate&&st.openDate>st.buildStart?"/"+diff(st.openDate,st.buildStart):"");
  } else if(st.buildStart) phase="Chưa thi công · còn "+diff(st.buildStart,T)+" ngày";
  else if(st.handover) phase=(st.handover<=T?"Đã nhận nhà ":"Nhận nhà ")+fd(st.handover)+" · chưa có ngày thi công";
  else phase="Chưa có ngày nhận nhà";
  const grp={};
  man.forEach(x=>{const g=x.it.group;grp[g]=grp[g]||{done:0,app:0,late:0,run:0};if(x.app){grp[g].app++;if(x.done)grp[g].done++;}if(x.w.k==="late")grp[g].late++;if(x.s==="Đang làm")grp[g].run++;});
  return {st,man,wfs,plan,planOn,mApp:mApp.length,mDone,wApp:wApp.length,wDone:wfs.filter(x=>x.s==="Hoàn thành").length,wAvg:wApp.length?wSum/100/wApp.length:0,prog,late,soon,status,sk,opened,dKT,phase,grp};
}
function tpls(){const t=cfg().templates;return Array.isArray(t)&&t.length?t:DEFAULT_TEMPLATES;}
function tplOf(st){
  const P=st.plan||{};
  if(P.tpl==="none") return null;
  if(P.tpl){const t=tpls().find(x=>x.id===P.tpl);if(t)return t;}
  const ty=String(st.type||"").toLowerCase();
  if(/thanh lý/.test(ty)) return null;
  return tpls().find(x=>x.match&&ty.includes(String(x.match).toLowerCase()))||tpls().find(x=>!x.match)||tpls()[0]||null;
}
function calcPlan(st){
  const T=today(),tpl=tplOf(st),P=st.plan||{};
  if(!tpl) return null;
  const kt=st.openDate||"";
  const items=tpl.items.map((d,i)=>{
    const e=(P.items||{})[d.id]||{};const s=e.status||"";
    const ps=e.pStart||(kt?addDays(kt,Number(d.start)||0):"");
    const nd=Number(e.pDays||d.days)||1;
    const pe=ps?addDays(ps,nd-1):"";
    let w;
    if(s==="Đã xong") w={k:"ok",t:"Đã xong"+(e.done?" "+fd(e.done):"")};
    else if(!ps) w={k:"todo",t:"Chưa có ngày KT"};
    else if(diff(T,pe)>0) w={k:"late",t:"Trễ "+diff(T,pe)+" ngày",d:diff(T,pe)};
    else if(s!=="Đang thi công"&&diff(T,ps)>0) w={k:"late",t:"Trễ bắt đầu "+diff(T,ps)+" ngày",d:diff(T,ps)};
    else if(s!=="Đang thi công"&&diff(ps,T)>=0&&diff(ps,T)<=2) w={k:"soon",t:diff(ps,T)===0?"Bắt đầu hôm nay":"Bắt đầu sau "+diff(ps,T)+" ngày"};
    else if(s==="Đang thi công") w={k:"run",t:"Đang thi công"};
    else w={k:"todo",t:"Chưa bắt đầu"};
    // % hoàn thành: nhập tay nếu có; không thì Đã xong=100, Chưa bắt đầu=0, Đang thi công = ước tính theo số ngày đã làm (tối đa 90%).
    let pct,est=false;
    if(e.pct!==undefined&&e.pct!==""&&e.pct!==null) pct=Math.max(0,Math.min(100,Number(e.pct)||0));
    else if(s==="Đã xong") pct=100;
    else if(s==="Đang thi công"){const st0=e.start||ps;pct=st0?Math.max(5,Math.min(90,Math.round((diff(T,st0)+1)/nd*100))):10;est=true;}
    else pct=0;
    const planPct=ps?Math.max(0,Math.min(100,Math.round((diff(T,ps)+1)/nd*100))):0;
    return {d,i,e,s,ps,pe,nd,w,pct,est,planPct,color:PLAN_COLORS[i%PLAN_COLORS.length],done:s==="Đã xong"};
  });
  const mats=tpl.materials.map((d,i)=>{
    const e=(P.mats||{})[d.id]||{};const s=e.status||"";
    const pd=e.pDate||(kt?addDays(kt,Number(d.offset)||0):"");
    let w;
    if(s==="Đã cấp") w={k:"ok",t:"Đã cấp"+(e.date?" "+fd(e.date):"")};
    else if(!pd) w={k:"todo",t:"Chưa có ngày KT"};
    else if(diff(T,pd)>0) w={k:"late",t:"Trễ cấp "+diff(T,pd)+" ngày",d:diff(T,pd)};
    else if(diff(pd,T)<=3) w={k:"soon",t:diff(pd,T)===0?"Cần cấp hôm nay":"Cấp sau "+diff(pd,T)+" ngày"};
    else w={k:"todo",t:"Chưa cấp"};
    return {d,i,e,s,pd,w,done:s==="Đã cấp"};
  });
  const W=items.reduce((a,x)=>a+x.nd,0)||1;
  const actPct=Math.round(items.reduce((a,x)=>a+x.pct*x.nd,0)/W);
  const planPct=kt?Math.round(items.reduce((a,x)=>a+x.planPct*x.nd,0)/W):null;
  return {tpl,items,mats,actPct,planPct,touched:items.some(x=>x.s||x.e.pct)||mats.some(x=>x.s),iDone:items.filter(x=>x.done).length,mDone:mats.filter(x=>x.done).length,
    late:items.filter(x=>x.w.k==="late").length+mats.filter(x=>x.w.k==="late").length,
    soon:items.filter(x=>x.w.k==="soon").length+mats.filter(x=>x.w.k==="soon").length};
}
function allCalc(){return Object.values(S.stores).map(calc);}
function sortStores(list){
  const ord={run:0,blank:1,ok:2,hold:3};
  return list.slice().sort((a,b)=>(ord[a.sk]-ord[b.sk])||
    (a.sk==="ok"?String(b.st.openDate).localeCompare(a.st.openDate):String(a.st.openDate||"9999").localeCompare(b.st.openDate||"9999"))||
    String(a.st.code||"").localeCompare(String(b.st.code||"")));
}
function actions(list){
  const out=[];
  list.forEach(c=>{
    if(c.st.hold) return;
    c.man.forEach(x=>{if(x.w.k==="late"||x.w.k==="soon") out.push({c,kind:x.w.k,what:x.it.name,step:"",status:x.s||"Chưa làm",pic:x.e.pic||c.st.pic||"",due:x.dl,w:x.w,link:firstUrl(x.e.link)});});
    c.wfs.forEach(x=>{if(["late","soon","notask","hold"].includes(x.w.k)) out.push({c,kind:x.w.k,what:x.wf.name,step:x.e.step||"",status:x.s,pic:x.e.pic||"",due:x.e.deadline||"",w:x.w,link:firstUrl(x.e.link)});});
    if(c.planOn){
      c.plan.items.forEach(x=>{if(x.w.k==="late"||x.w.k==="soon") out.push({c,kind:x.w.k,what:"Thi công: "+x.d.name,step:"Kế hoạch "+fd(x.ps)+" → "+fd(x.pe),status:x.s||"Chưa bắt đầu",pic:x.e.pic||"",due:x.w.t.startsWith("Trễ bắt")||x.w.t.startsWith("Bắt đầu")?x.ps:x.pe,w:x.w,link:""});});
      c.plan.mats.forEach(x=>{if(x.w.k==="late"||x.w.k==="soon") out.push({c,kind:x.w.k,what:"Vật tư: "+x.d.name,step:"Cần cấp "+fd(x.pd),status:x.s||"Chưa cấp",pic:x.e.pic||"",due:x.pd,w:x.w,link:""});});
    }
  });
  const rank={late:0,soon:1,hold:2,notask:3};
  return out.sort((a,b)=>(rank[a.kind]-rank[b.kind])||String(a.due||"9999").localeCompare(b.due||"9999"));
}
function stages(st){
  const T=today();
  const arr=[["handover","Nhận nhà"],["openDate","Khai trương"]].map(([k,l])=>({k,l,d:st[k]||"",done:!!st[k]&&st[k]<=T}));
  for(let i=arr.length-2;i>=0;i--) if(arr[i+1].done) arr[i].done=true;
  const ci=arr.findIndex(x=>!x.done); arr.forEach((x,i)=>x.cur=i===ci); return arr;
}
function countdown(c){
  if(c.st.hold) return {d:"—",k:"",l:"tạm hoãn"};
  if(c.dKT===null) return {d:"—",k:"",l:"chưa có ngày KT"};
  if(c.opened) return {d:fd(c.st.openDate),k:"ok",l:"đã khai trương"};
  if(c.dKT===0) return {d:"Hôm nay",k:"late",l:"khai trương"};
  return {d:"D−"+c.dKT,k:c.dKT<=7?"late":c.dKT<=14?"soon":"",l:"KT "+fd(c.st.openDate)};
}
function latestLog(id){return S.logs.filter(l=>l.storeId===id).sort((a,b)=>String(b.date+(b.ts||"")).localeCompare(a.date+(a.ts||"")))[0];}

function viewOverview(){

function card(c){

  return `<a class="panel card ${c.late?"is-late":""}" href="#cn-${esc(c.st.id)}">
    <div class="c-top"><div class="t"><h3>${esc(c.st.name||"(Chưa đặt tên)")}</h3><div class="meta">${esc(c.st.type||"—")}${c.st.pic?" · "+esc(c.st.pic):""}</div></div>
      <div class="cdb ${cd.k}"><b>${cd.d}</b><span>${esc(cd.l)}</span></div></div>
    <div class="c-mid">${ring(c.prog,54,6,pct(c.prog))}<div class="info"><div class="c-pills">${pill(c.sk,c.status)}${c.late?pill("late",c.late+" trễ"):""}${c.soon?pill("soon",c.soon+" sắp hạn"):""}</div><div class="phase">${esc(c.phase)}</div></div></div>
    ${stepper(c.st,false)}
    <div class="c-foot">${dots(c)}${c.plan?`<div class="sm" style="white-space:normal">Thi công ${c.plan.iDone}/${c.plan.items.length} hạng mục xong · Vật tư ${c.plan.mDone}/${c.plan.mats.length} đã cấp${c.planOn&&c.plan.late?` · <b style="color:var(--late)">${c.plan.late} trễ</b>`:""}</div>`:""}<div class="c-note">${note}</div></div></a>`;
}
function grpCell(g){
  if(!g||!g.app) return pill("na","–",'nodot');
  if(g.late) return pill("late",g.done+"/"+g.app+" · trễ "+g.late);
  if(g.done===g.app) return pill("ok",g.done+"/"+g.app);
  if(g.done||g.run) return pill("run",g.done+"/"+g.app);
  return pill("blank",g.done+"/"+g.app);
}
function wfCell(x){
  let t;
  if(x.w.k==="ok") t="Xong"; else if(x.w.k==="na") t="Không AD"; else if(x.w.k==="notask") t="Chưa tạo task"; else if(x.w.k==="blank") t="Chưa cập nhật";
  else t=(x.code||"—")+(x.w.k==="late"?" · trễ "+x.w.d+"N":x.w.k==="hold"?" · dừng":x.e.deadline?" · "+fd(x.e.deadline):"");
  return `<span title="${esc(x.wf.name+(x.e.step?": "+x.e.step:""))}">${pill(x.w.k,t)}</span>`;
}
function planCell(x,kind){
  const P=x.plan;if(!P) return pill("na","–","nodot");
  const arr=kind==="i"?P.items:P.mats,dn=kind==="i"?P.iDone:P.mDone,lt=arr.filter(y=>y.w.k==="late").length;
  if(lt) return pill("late",dn+"/"+arr.length+" · trễ "+lt);
  if(dn===arr.length) return pill("ok",dn+"/"+arr.length);
  return pill(dn||arr.some(y=>y.s==="Đang thi công")?"run":"blank",dn+"/"+arr.length);
}
function matrix(list){
  if(!list.length) return "";
  const c=cfg(); const groups=[...new Set(c.manual.map(m=>m.group))];
  const foot=[["hoàn thành",x=>x.w.k==="ok",g=>g.app&&g.done===g.app],["đang thực hiện",x=>["run","soon"].includes(x.w.k),g=>g.app&&g.done<g.app&&!g.late&&(g.done||g.run)],["trễ hạn",x=>x.w.k==="late",g=>g.late>0],["chưa tạo task / tạm dừng",x=>["notask","hold"].includes(x.w.k),()=>false]];
  return `<section class="sec"><div class="sec-h"><h2>Hiện trạng hạng mục &amp; workflow</h2><span class="sub">Mã bước = bước WF hiện tại</span>
    <div class="right legend"><span><i style="background:var(--ok)"></i>Xong</span><span><i style="background:var(--run)"></i>Đang làm</span><span><i style="background:var(--soon)"></i>Sắp hạn</span><span><i style="background:var(--late)"></i>Trễ</span><span><i style="background:var(--hold)"></i>Chưa tạo task / dừng</span><span><i style="background:var(--track)"></i>Chưa cập nhật</span></div></div>
  <div class="panel tbl"><table><thead><tr><th>Chi nhánh</th><th>KT</th>${groups.map(g=>`<th>${esc(g)}</th>`).join("")}${c.workflows.map(w=>`<th>${esc(shortWf(w.name))}</th>`).join("")}<th>TB WF</th><th>Thi công</th><th>Vật tư</th></tr></thead>
  <tbody>${list.map(x=>`<tr><td class="name"><a href="#cn-${esc(x.st.id)}">${esc(x.st.name)}</a></td><td>${x.st.openDate?fd(x.st.openDate):"—"}</td>${groups.map(g=>`<td>${grpCell(x.grp[g])}</td>`).join("")}${x.wfs.map(w=>`<td>${wfCell(w)}</td>`).join("")}<td>${pct(x.wAvg)}</td><td>${planCell(x,"i")}</td><td>${planCell(x,"m")}</td></tr>`).join("")}</tbody>
  <tfoot>${foot.map(f=>`<tr><td>Số MB ${f[0]}</td><td></td>${groups.map(g=>`<td>${list.filter(x=>x.grp[g]&&f[2](x.grp[g])).length}</td>`).join("")}${c.workflows.map((w,j)=>`<td>${list.filter(x=>f[1](x.wfs[j])).length}</td>`).join("")}<td></td><td></td><td></td></tr>`).join("")}</tfoot></table></div></section>`;
}

function viewTimeline(){
  const all=sortStores(allCalc().filter(c=>!c.st.hold)), T=today();
  const dated=all.filter(c=>c.st.openDate||c.st.handover||c.st.buildStart);
  const undated=all.filter(c=>!dated.includes(c));
  let h=`<div class="ph"><div><h1>Lịch tiến độ</h1><p>Nhận nhà → thi công → khai trương của từng chi nhánh</p></div>
    <div class="right legend"><span><i style="background:repeating-linear-gradient(-45deg,var(--sunk) 0 3px,var(--line-2) 3px 6px)"></i>Chuẩn bị mặt bằng</span><span><i style="background:var(--run)"></i>Thi công (đậm = đã qua)</span><span><i style="background:var(--accent);transform:rotate(45deg)"></i>Khai trương</span><span><i style="background:var(--late);width:3px"></i>Hôm nay</span></div></div>`;
  if(!dated.length) return h+`<div class="panel empty"><b>Chưa có chi nhánh nào có ngày</b>Nhập ngày nhận nhà, thi công hoặc khai trương trong trang chi nhánh để thấy lịch.</div>`;
  const ds=[T];dated.forEach(c=>["handover","buildStart","openDate"].forEach(k=>c.st[k]&&ds.push(c.st[k])));
  ds.sort();const a=addDays(ds[0],-3),b=addDays(ds[ds.length-1],5);
  const span=diff(b,a)||1, X=s=>diff(s,a)/span*100;
  const ticks=[];let t=a;const dow=new Date(toT(t)).getUTCDay();t=addDays(t,(8-dow)%7);
  while(t<=b){ticks.push(t);t=addDays(t,7);}
  const head=`<div class="tl-row tl-head"><div class="tl-label" style="cursor:default"><span>Chi nhánh · tuần bắt đầu thứ Hai</span></div><div class="tl-track">${ticks.map(x=>`<div class="tl-tick" style="left:${X(x)}%">${fd(x)}</div>`).join("")}</div></div>`;
  const rows=dated.map(c=>{
    const s=c.st;let bars="";
    const p0=s.handover,p1=s.buildStart||s.openDate;
    if(p0&&p1&&p1>p0) bars+=`<div class="tl-bar prep" style="left:${X(p0)}%;width:${X(p1)-X(p0)}%" title="Chuẩn bị: ${fd(p0)} → ${fd(p1)}"></div>`;
    if(s.buildStart){const e=s.openDate&&s.openDate>s.buildStart?s.openDate:addDays(s.buildStart,1);const done=Math.max(0,Math.min(1,(diff(T,s.buildStart)+1)/((diff(e,s.buildStart)+1)||1)));
      bars+=`<div class="tl-bar build" style="left:${X(s.buildStart)}%;width:${Math.max(.6,X(e)-X(s.buildStart))}%" title="Thi công: ${fd(s.buildStart)} → ${fd(e)}"><i style="width:${Math.round(done*100)}%"></i></div>`;}
    if(s.openDate) bars+=`<div class="tl-kt" style="left:${X(s.openDate)}%" title="Khai trương ${fdy(s.openDate)}"></div>`;
    return `<div class="tl-row"><button class="tl-label" type="button" data-go="${esc(s.id)}">${esc(s.name)}<span>${esc(c.phase)} · ${pct(c.prog)}</span></button><div class="tl-track">${ticks.map(x=>`<div class="tl-grid" style="left:${X(x)}%"></div>`).join("")}${bars}</div></div>`;
  }).join("");
  h+=`<div class="panel tl"><div class="tl-inner">${head}${rows}<div style="position:absolute;top:0;bottom:0;left:250px;right:0;pointer-events:none"><div class="tl-today" style="left:${X(T)}%"><b>Hôm nay ${fd(T)}</b></div></div></div></div>`;
  if(undated.length) h+=`<p class="muted" style="margin-top:14px;font-size:13px">Chưa có ngày: ${undated.map(c=>`<a href="#cn-${esc(c.st.id)}">${esc(c.st.name)}</a>`).join(" · ")}</p>`;
  return h;
}

function inp(id,key,val,type,extra){

  return `<input class="in" id="${id}" data-k="${key}" type="${type||"text"}" value="${esc(val)}"${ro} ${extra||""}>`;
}
function buildPanel(st,c){
  const dis=S.canWrite?"":"readonly";
  const dates=`<div class="cp-dates">${[["handover","Nhận nhà"],["buildStart","Bắt đầu thi công"],["openDate","Khai trương"]].map(([k,l])=>`<div class="field"><label for="f-${k}">${l}</label><input class="in" type="date" id="f-${k}" data-k="${k}" value="${esc(st[k]||"")}" ${dis}></div>`).join("")}</div>`;

  const nDone=app.filter(x=>x.w.k==="ok").length, nLate=app.filter(x=>x.w.k==="late").length;

  const synced=st.wfSyncedAt?`đồng bộ task lúc ${st.wfSyncedAt.slice(11,16)} ${fd(st.wfSyncedAt.slice(0,10))}`:"chưa đồng bộ task";
  const k=pctAll>=100?"ok":nLate?"late":"run";
  const rows=c.wfs.map((x,i)=>{
    const name=shortWf(x.wf.name);
    const stepTxt=x.s==="Không áp dụng"?"Không áp dụng":x.e.taskStep&&x.fromTask?x.e.taskStep:(x.e.step||x.w.t);
    const col=x.w.k==="ok"?"var(--ok)":x.w.k==="late"?"var(--late)":x.w.k==="hold"||x.w.k==="notask"?"var(--hold)":"var(--run)";
    return `<button type="button" class="cp-wf ${x.app?"":"na"}" data-jump="sec-b" title="${esc(x.wf.name)} · ${esc(stepTxt)} · ${esc(x.w.t)}">

      <span class="mb"><i style="width:${x.app?x.p:0}%;background:${col}"></i></span>
      <b class="pv">${x.app?x.p+"%":"–"}${x.fromTask?`<span class="src">TASK</span>`:""}</b></button>`;
  }).join("");
  return `<section class="panel cprog"><div class="cp-top">
    <div class="cp-big"><div class="lbl">Tiến độ thi công cửa hàng · theo các bước WF</div><div class="cp-v">${pctAll}<small>%</small></div>
      <div class="cp-meta">${pctAll>=100?pill("ok","Hoàn thành tất cả WF"):nLate?pill("late",nLate+" WF trễ hạn bước"):pill("run","Đang thực hiện")}<span class="muted">${app.length} WF áp dụng · ${nTask} lấy % từ task · ${esc(synced)}</span></div></div>
    <div class="cp-side"><div><b>${nDone}/${app.length}</b><span>WF hoàn thành</span></div><div><b style="color:${nLate?"var(--late)":"inherit"}">${nLate}</b><span>WF trễ hạn bước</span></div><div><b style="color:${nBlank?"var(--hold)":"inherit"}">${nBlank}</b><span>chưa có task / chưa cập nhật</span></div></div>
    ${syncBtn("syncTop","Đồng bộ từ task")}
  </div>
  <div class="cp-bar"><i class="${k}" style="width:${pctAll}%"></i></div>
  <div class="cp-wfs">${rows}</div>

  ${dates}</section>`;

function planSection(st,c){
  const P=c.plan,dis=S.canWrite?"":"disabled";
  const sel=(st.plan||{}).tpl||"";
  const tplSel=`<label class="lbl" for="pl-tpl">Mẫu tiến độ</label><select class="in" id="pl-tpl" data-k="plan.tpl" ${dis}><option value="" ${!sel?"selected":""}>Tự chọn theo loại hình${!sel&&P?" ("+esc(P.tpl.name)+")":""}</option>${tpls().map(t=>`<option value="${esc(t.id)}" ${sel===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}<option value="none" ${sel==="none"?"selected":""}>Không áp dụng</option></select>`;
  let h=`<section class="sec anchor" id="sec-c"><div class="sec-h"><h2>C. Tiến độ thi công &amp; cấp vật tư</h2><span class="sub">Kế hoạch theo mẫu, tính lùi từ ngày khai trương</span></div><div class="panel items">`;
  h+=`<div class="plan-head">${tplSel}${P?`<div class="plan-sum">${pill(P.iDone===P.items.length?"ok":"run",`Thi công ${P.iDone}/${P.items.length}`)}${pill(P.mDone===P.mats.length?"ok":"run",`Vật tư ${P.mDone}/${P.mats.length}`)}${P.late?pill("late",P.late+" trễ"):""}${P.soon?pill("soon",P.soon+" sắp tới"):""}</div>`:""}</div>`;
  if(!P) return h+`<div class="empty" style="padding:22px">Chi nhánh này không áp dụng mẫu tiến độ. Chọn mẫu ở trên để bật.</div></div></section>`;
  if(!st.openDate) return h+`<div class="empty" style="padding:22px">Nhập <b style="display:inline">ngày khai trương</b> ở phần mốc thi công để tool tự tính lịch thi công và lịch cấp vật tư.</div></div></section>`;
  // ---- Gantt ----
  const T=today(),kt=st.openDate;
  const ds=[kt];P.items.forEach(x=>{if(x.ps)ds.push(x.ps);if(x.e.start)ds.push(x.e.start);});P.mats.forEach(x=>{if(x.pd)ds.push(x.pd);if(x.e.date)ds.push(x.e.date);});
  ds.sort();const a=ds[0],b=ds[ds.length-1]>kt?ds[ds.length-1]:kt;const n=diff(b,a)+1;
  const days=[...Array(n)].map((_,i)=>addDays(a,i));
  const WDS=["CN","T2","T3","T4","T5","T6","T7"];
  const dow=x=>new Date(toT(x)).getUTCDay();
  const colOf=x=>diff(x,a)+2;
  const bg=days.map((x,i)=>`<div class="g-col ${dow(x)===0?"we":""} ${x===T?"td":""} ${x===kt?"kt":""}" style="grid-column:${i+2}"></div>`).join("");
  let g=`<div class="gantt-wrap"><div class="gantt" style="--n:${n}">`;
  g+=`<div class="g-row g-head"><div class="g-lab">Hạng mục · KT ${fdy(kt)}</div>${days.map((x,i)=>`<div class="g-day ${dow(x)===0?"we":""}" style="grid-column:${i+2}"><span>${WDS[dow(x)]}</span><b>${x.slice(8,10)}/${x.slice(5,7)}</b></div>`).join("")}</div>`;
  g+=`<div class="g-row g-sec"><div class="g-lab">Thi công</div>${bg}</div>`;
  P.items.forEach(x=>{
    let r=`<div class="g-row"><div class="g-lab" title="${esc(x.d.name)}"><span class="no" style="background:${x.color}">${x.i+1}</span><span>${esc(x.d.name)}</span></div>${bg}`;
    if(x.ps){const cls=x.done?"ok":x.w.k==="late"?"late":x.s==="Đang thi công"?"run":"";
      r+=`<div class="g-bar ${cls}" style="grid-column:${colOf(x.ps)} / ${colOf(x.pe)+1};background-color:${x.color}" title="${esc(x.d.name)}: ${fd(x.ps)} → ${fd(x.pe)} (${x.nd} ngày) · ${x.pct}% · ${esc(x.w.t)}">${x.done?"✓ ":""}${x.nd} ngày · ${x.pct}%</div>`;
      if(x.d.tail&&!x.e.pStart){const td=addDays(x.pe,1);if(td<=b)r+=`<div class="g-tail" style="grid-column:${colOf(td)}">${esc(x.d.tail.replace("Trực Khai Trương","Trực KT"))}</div>`;}
      if(x.e.start){const ae=x.e.done||(x.done?x.e.start:T);if(ae>=x.e.start&&x.e.start>=a)r+=`<div class="g-act" style="grid-column:${colOf(x.e.start)} / ${colOf(ae<=b?ae:b)+1}" title="Thực tế: ${fd(x.e.start)} → ${x.e.done?fd(x.e.done):"nay"}"></div>`;}
    }
    g+=r+`</div>`;
  });
  g+=`<div class="g-row g-sec"><div class="g-lab">Cấp vật tư</div>${bg}</div>`;
  P.mats.forEach(x=>{

    if(x.pd) r+=`<div class="g-mk ${x.w.k}" style="grid-column:${colOf(x.pd)}" title="Cần cấp ${fd(x.pd)} · ${esc(x.w.t)}"><i></i></div>`;

    g+=r+`</div>`;
  });
  g+=`</div></div><div class="legend" style="padding:10px 16px;border-top:1px solid var(--line)"><span><i style="background:var(--run);opacity:.55"></i>Kế hoạch thi công (đậm = đang làm/xong, viền đỏ = trễ)</span><span><i style="background:var(--ink);height:4px"></i>Thực tế</span><span><i style="background:var(--na);transform:rotate(45deg)"></i>Ngày cần cấp vật tư</span><span><i style="background:var(--ink);border-radius:50%"></i>Ngày cấp thực tế</span><span><i style="background:var(--late);width:3px"></i>Hôm nay</span></div>`;
  h+=g;
  // ---- cập nhật hạng mục ----
  h+=`<div class="grp"><span>Hạng mục thi công</span><span>${P.iDone}/${P.items.length} xong</span></div>`;
  P.items.forEach(x=>{
    const id=x.d.id,open=S.open.has("p"+id),e=x.e;
    h+=`<div class="item"><div class="item-main pl-main">${stIcon(x.w.k==="todo"?"":x.w.k)}
      <div class="item-name"><b>${esc(x.d.name)}</b><div class="sub"><span class="off" style="border-color:${x.color};color:${x.color}">KT${x.d.start}</span><span><b style="color:var(--ink)">${x.pct}%${x.est?"*":""}</b> · KH hôm nay ${x.planPct}%</span><span>Kế hoạch ${x.ps?fd(x.ps)+" → "+fd(x.pe)+" · "+x.nd+" ngày":"—"}</span>${e.start?`<span>Thực tế ${fd(e.start)}${e.done?" → "+fd(e.done):" → nay"}</span>`:""}${e.pic?`<span>${esc(e.pic)}</span>`:""}</div></div>
      <div class="seg" role="group" aria-label="Trạng thái ${esc(x.d.name)}">${ISTAT.map(v=>`<button type="button" data-pstat="${id}" data-v="${v}" aria-pressed="${(x.s||"Chưa bắt đầu")===v}" ${dis}>${v}</button>`).join("")}</div>
      <div class="warn">${pill(x.w.k,x.w.t)}</div>
      <button class="exp" type="button" data-toggle="p${id}" aria-expanded="${open}" aria-label="Chi tiết">${ic("chev")}</button></div>
      ${open?`<div class="item-more">
        <div class="field"><label for="p-${id}-start">Bắt đầu thực tế</label>${inp(`p-${id}-start`,`plan.items.${id}.start`,e.start,"date")}</div>
        <div class="field"><label for="p-${id}-done">Hoàn thành thực tế</label>${inp(`p-${id}-done`,`plan.items.${id}.done`,e.done,"date")}</div>
        <div class="field"><label for="p-${id}-ps">Đổi ngày bắt đầu kế hoạch</label>${inp(`p-${id}-ps`,`plan.items.${id}.pStart`,e.pStart||"","date")}</div>
        <div class="field"><label for="p-${id}-pd">Đổi số ngày kế hoạch</label>${inp(`p-${id}-pd`,`plan.items.${id}.pDays`,e.pDays||"","number",`min="1" placeholder="${x.d.days}"`)}</div>
        <div class="field"><label for="p-${id}-pct">% hoàn thành thực tế</label>${inp(`p-${id}-pct`,`plan.items.${id}.pct`,e.pct??"","number",`min="0" max="100" placeholder="${x.est?"ước tính "+x.pct:x.pct}"`)}</div>
        <div class="field"><label for="p-${id}-pic">Đội / NCC thực hiện</label>${inp(`p-${id}-pic`,`plan.items.${id}.pic`,e.pic)}</div>
        <div class="field wide" style="grid-column:span 3"><label for="p-${id}-note">Ghi chú / vướng mắc</label>${inp(`p-${id}-note`,`plan.items.${id}.note`,e.note)}</div>
      </div>`:""}</div>`;

      </div>`:""}</div>`;

  return h+`</div></section>`;

const SEED={"stores":{},"logs":[]};
const LS_DATA="tdtc-data",LS_SET="tdtc-settings";
const SET={token:"",apiBase:"https://wshr.hasaki.vn/api/hr/projects/task-input",autoMin:30,mode:"local"};
try{Object.assign(SET,JSON.parse(localStorage.getItem(LS_SET)||"{}"));}catch(e){}
function saveSet(){try{localStorage.setItem(LS_SET,JSON.stringify(SET));}catch(e){}}
const STORE={mode:"local",handle:null,name:"",lastMod:0,queue:[],timer:null,busy:false,needPerm:false,rev:0,api:"",offerSeed:false,serverSync:false};
// Địa chỉ máy chủ dữ liệu chung (Apps Script /exec): ưu tiên config.js (window.TDTC_API), sau đó ô nhập trong Cấu hình.
function sheetApi(){return String((window.TDTC_API||SET.sheetUrl||"")).trim();}
async function sheetGet(action){const r=await fetch(sheetApi()+(sheetApi().includes("?")?"&":"?")+"action="+action,{cache:"no-store",redirect:"follow"});if(!r.ok)throw new Error("Máy chủ Google trả lỗi "+r.status);const j=await r.json();if(j.error)throw new Error(j.error);return j;}
async function sheetPost(body){const r=await fetch(sheetApi(),{method:"POST",body:JSON.stringify(body),redirect:"follow"});if(!r.ok)throw new Error("Máy chủ Google trả lỗi "+r.status);const j=await r.json();if(j.error)throw new Error(j.error);return j;}
function fromServer(j){const d=normData(j.data||{});d.rev=j.rev||0;STORE.rev=j.rev||0;if(typeof j.sync==="boolean")STORE.serverSync=j.sync;return d;}

let DATA=null;
function fillNames(){}
let toastT;
function toast(msg,err){const t=document.getElementById("toast");t.innerHTML=(err?"":ic("check"))+`<span>${esc(msg)}</span>`;t.className="show"+(err?" err":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className=err?"err":"",err?6000:1500);}
function nest(key,val){const parts=key.split(".");const o={};let cur=o;parts.forEach((p,i)=>{if(i===parts.length-1)cur[p]=val;else cur=cur[p]={};});return o;}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k]))a[k]=merge(a[k]&&typeof a[k]==="object"?a[k]:{},b[k]);else a[k]=b[k];}return a;}
const clone=o=>JSON.parse(JSON.stringify(o));
function now(){const d=new Date();return today()+"T"+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());}
function hm(){const d=new Date();return p2(d.getHours())+":"+p2(d.getMinutes());}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function normData(d){d=d&&typeof d==="object"?d:{};if(Array.isArray(d.stores)){const m={};d.stores.forEach(x=>{if(x&&x.id)m[x.id]=x;});d.stores=m;}d.stores=d.stores||{};d.logs=Array.isArray(d.logs)?d.logs:[];d.config=d.config&&d.config.workflows?d.config:null;d.rev=d.rev||1;return d;}
function applyOp(d,op){
  switch(op.t){
    case "patch": if(d.stores[op.id]) merge(d.stores[op.id],clone(op.patch)); break;
    case "create": d.stores[op.store.id]=clone(op.store); break;
    case "del": delete d.stores[op.id]; d.logs=d.logs.filter(l=>l.storeId!==op.id); break;
    case "log": if(!d.logs.some(l=>l.id===op.log.id)) d.logs.push(clone(op.log)); break;
    case "dellog": d.logs=d.logs.filter(l=>l.id!==op.id); break;
    case "config": d.config=clone(op.config); break;
    case "sync": for(const id in op.patches) if(d.stores[id]) merge(d.stores[id],clone(op.patches[id])); d.lastSync=clone(op.lastSync); break;
    case "replace": {const n=normData(clone(op.data));d.config=n.config;d.stores=n.stores;d.logs=n.logs;d.lastSync=n.lastSync||null;break;}
  }
  d.rev=(d.rev||0)+1; return d;
}
function toState(){
  S.config=DATA.config;S.stores=DATA.stores;S.logs=DATA.logs;S.lastSync=DATA.lastSync||null;
  S.syncEnabled=STORE.mode==="sheet"?STORE.serverSync:!!SET.token;S.autoSync=STORE.mode==="sheet"?0:(SET.token?Number(SET.autoMin)||0:0);
  S.ready.stores=S.ready.config=S.ready.logs=true;
}
function persistLocal(){try{localStorage.setItem(LS_DATA,JSON.stringify(DATA));return true;}catch(e){toast("Không lưu được vào trình duyệt (bộ nhớ đầy?). Hãy dùng file dữ liệu chung.",true);return false;}}
function commit(op,quiet){
  applyOp(DATA,op);toState();persistLocal();
  if(STORE.mode==="file"){STORE.queue.push(op);scheduleFlush();}
  else if(STORE.mode==="sheet"){STORE.queue.push(op);setSync("live","Đang lưu…");clearTimeout(STORE.timer);STORE.timer=setTimeout(flushSheet,350);}
  else{if(!quiet)toast("Đã lưu");setSync("live","Đã lưu "+hm());}
  schedule();
}
function saveStore(id,patch){
  if(!S.canWrite||!DATA.stores[id]) return;
  patch.updatedAt=now();patch.updatedBy=S.me||"";
  commit({t:"patch",id,patch});
}
// ---- file dữ liệu chung (File System Access API: Chrome/Edge) ----
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("tdtc",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);});}catch(e){return null;}}
async function kvSet(k,v){try{const db=await idb();await new Promise(res=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=res;});}catch(e){}}
async function readFile(){const f=await STORE.handle.getFile();STORE.lastMod=f.lastModified;const txt=await f.text();if(!txt.trim())return null;return normData(JSON.parse(txt));}
async function writeFile(d){const w=await STORE.handle.createWritable();await w.write(JSON.stringify(d,null,1));await w.close();const f=await STORE.handle.getFile();STORE.lastMod=f.lastModified;}
function scheduleFlush(){clearTimeout(STORE.timer);STORE.timer=setTimeout(flush,500);}
async function flush(){
  if(STORE.busy){scheduleFlush();return;} if(!STORE.queue.length||!STORE.handle) return;
  STORE.busy=true;const ops=STORE.queue.splice(0);
  try{
    if((await STORE.handle.queryPermission({mode:"readwrite"}))!=="granted"){STORE.needPerm=true;throw new Error("cần cho phép lại file dữ liệu");}
    let d=await readFile();
    if(d){ops.forEach(op=>applyOp(d,op));}else d=clone(DATA);
    await writeFile(d);DATA=d;toState();persistLocal();
    toast("Đã lưu");setSync("live","Đã lưu vào file "+hm());
  }catch(e){STORE.queue.unshift(...ops);setSync("off","Chưa lưu vào file chung");toast("Chưa lưu vào file chung: "+e.message,true);}
  STORE.busy=false;schedule();
}
async function flushSheet(){
  if(STORE.busy){clearTimeout(STORE.timer);STORE.timer=setTimeout(flushSheet,400);return;}
  if(!STORE.queue.length) return;
  STORE.busy=true;const ops=STORE.queue.splice(0);
  try{
    const j=await sheetPost({action:"ops",ops});
    const d=fromServer(j);STORE.queue.forEach(op=>applyOp(d,op));// thay đổi phát sinh trong lúc gửi
    DATA=d;toState();persistLocal();toast("Đã lưu");setSync("live","Đã lưu lên Google Sheet "+hm());
  }catch(e){STORE.queue.unshift(...ops);setSync("off","Chưa lưu được");toast("Chưa lưu lên Google Sheet: "+e.message+". Tool sẽ thử lại.",true);setTimeout(()=>{if(STORE.queue.length)flushSheet();},8000);}
  STORE.busy=false;schedule();
}
async function pollSheet(){
  if(STORE.mode!=="sheet"||STORE.busy||STORE.queue.length||document.hidden||S.syncing) return;
  try{
    const r=await sheetGet("rev");
    if(r.rev!==STORE.rev){const j=await sheetGet("state");if(!STORE.queue.length&&!STORE.busy){DATA=fromServer(j);toState();persistLocal();schedule();}}
    setSync("live","Đã đồng bộ Google Sheet "+hm());
  }catch(e){setSync("off","Mất kết nối Google Sheet");}
}
async function connectSheet(url){
  if(url!==undefined){SET.sheetUrl=url.trim();saveSet();}
  if(!sheetApi()){STORE.mode=SET.mode==="file"?"file":"local";render();return;}
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(sheetApi())&&!/^http:\/\/(127\.0\.0\.1|localhost)/.test(sheetApi())){toast("Địa chỉ phải là URL ứng dụng web Apps Script (https://script.google.com/macros/s/…/exec)",true);return;}
  setSync("live","Đang kết nối Google Sheet…");
  try{
    const j=await sheetGet("state");const d=fromServer(j);
    STORE.mode="sheet";STORE.handle=null;STORE.needPerm=false;
    if(!Object.keys(d.stores).length&&Object.keys(DATA.stores).length){STORE.offerSeed=true;} // Sheet trống: hỏi có đẩy dữ liệu hiện có lên không
    else{STORE.offerSeed=false;DATA=d;persistLocal();}
    toState();setSync("live","Đã kết nối Google Sheet");render();
    if(url!==undefined)toast(STORE.offerSeed?"Đã kết nối. Google Sheet đang trống — bấm “Đẩy dữ liệu lên Sheet”.":"Đã kết nối Google Sheet");
  }catch(e){STORE.mode=SET.mode==="file"?"file":"local";toState();setSync("off","Không kết nối được Google Sheet");toast("Không kết nối được Google Sheet: "+e.message,true);render();}
}
async function seedSheet(){
  try{const c=cfg();const data={config:{manual:c.manual,workflows:c.workflows,templates:tpls()},stores:DATA.stores,logs:DATA.logs,lastSync:DATA.lastSync||null};
    const j=await sheetPost({action:"ops",ops:[{t:"replace",data}]});DATA=fromServer(j);STORE.offerSeed=false;toState();persistLocal();render();
    toast("Đã đẩy "+Object.keys(DATA.stores).length+" chi nhánh lên Google Sheet");}
  catch(e){toast("Không đẩy được dữ liệu: "+e.message,true);}
}
async function pollFile(){
  if(STORE.mode!=="file"||!STORE.handle||STORE.busy||STORE.queue.length||document.hidden) return;
  try{
    if((await STORE.handle.queryPermission({mode:"readwrite"}))!=="granted"){if(!STORE.needPerm){STORE.needPerm=true;render();}return;}
    const f=await STORE.handle.getFile();
    if(f.lastModified!==STORE.lastMod){const d=await readFile();if(d){DATA=d;toState();persistLocal();schedule();}}
    setSync("live","Đã đọc file "+hm());
  }catch(e){setSync("off","Không đọc được file chung");}
}
const JSON_TYPES=[{description:"Dữ liệu tiến độ thi công",accept:{"application/json":[".json"]}}];
async function linkFile(create){
  if(!window.showOpenFilePicker){toast("Trình duyệt này chưa hỗ trợ file dữ liệu chung. Dùng Chrome hoặc Edge trên máy tính.",true);return;}
  try{
    const h=create?await showSaveFilePicker({suggestedName:"tien-do-thi-cong-data.json",types:JSON_TYPES}):(await showOpenFilePicker({types:JSON_TYPES,multiple:false}))[0];
    if((await h.requestPermission({mode:"readwrite"}))!=="granted"){toast("Cần cho phép đọc/ghi file để dùng chung.",true);return;}
    STORE.handle=h;STORE.mode="file";STORE.name=h.name;STORE.needPerm=false;SET.mode="file";saveSet();await kvSet("handle",h);
    const d=create?null:await readFile();
    if(d&&Object.keys(d.stores).length){DATA=d;}else{await writeFile(DATA);}
    toState();persistLocal();render();toast(create?"Đã tạo file dữ liệu chung":"Đã mở file dữ liệu chung");
  }catch(e){if(e&&e.name!=="AbortError")toast("Không mở được file: "+e.message,true);}
}
async function grantFile(){
  try{if(!STORE.handle){STORE.handle=await kvGet("handle");}
    if(!STORE.handle){linkFile(false);return;}
    if((await STORE.handle.requestPermission({mode:"readwrite"}))!=="granted") return;
    STORE.needPerm=false;STORE.mode="file";STORE.name=STORE.handle.name;
    const d=await readFile();if(d){if(STORE.queue.length)STORE.queue.forEach(op=>applyOp(d,op));DATA=d;toState();persistLocal();}
    if(STORE.queue.length) flush();
    render();toast("Đã mở file dữ liệu chung");
  }catch(e){toast("Không mở được file: "+e.message,true);}
}
async function unlinkFile(){STORE.mode="local";STORE.handle=null;STORE.name="";STORE.needPerm=false;SET.mode="local";saveSet();await kvSet("handle",null);persistLocal();render();toast("Đã chuyển sang lưu trên trình duyệt này");}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportJson(){download("tien-do-thi-cong-"+today()+".json",JSON.stringify(DATA,null,1),"application/json");}
async function importJson(file){
  try{const d=normData(JSON.parse(await file.text()));if(!Object.keys(d.stores).length)throw new Error("file không có chi nhánh nào");commit({t:"replace",data:d});toast("Đã khôi phục "+Object.keys(d.stores).length+" chi nhánh");}
  catch(e){toast("File không hợp lệ: "+e.message,true);}
}

app.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.k&&S.view==="cn"){
    const id=S.storeId,k=el.dataset.k;let v=el.value;
    if(k==="hold") v=!!v;
    if(/\.pDays$/.test(k)) v=v?Math.max(1,parseInt(v,10)||1):"";
    if(/^plan\.items\.\w+\.pct$/.test(k)){const pid=k.split(".")[2];const ex=(((S.stores[id].plan||{}).items||{})[pid])||{};
      if(v===""){saveStore(id,{plan:{items:{[pid]:{pct:""}}}});return;}
      const n=Math.max(0,Math.min(100,Math.round(Number(v)||0)));const pp={pct:n};
      if(n>=100){pp.status="Đã xong";if(!ex.done)pp.done=today();if(!ex.start)pp.start=today();}
      else if(n>0){if(ex.status!=="Đang thi công")pp.status="Đang thi công";if(!ex.start)pp.start=today();pp.done="";}
      else{pp.status="";pp.done="";}
      saveStore(id,{plan:{items:{[pid]:pp}}});return;}
    if(/^plan\.items\.\w+\.done$/.test(k)&&v){const pid=k.split(".")[2];const ex=(((S.stores[id].plan||{}).items||{})[pid])||{};if(ex.status!=="Đã xong"){saveStore(id,{plan:{items:{[pid]:{done:v,status:"Đã xong",start:ex.start||v}}}});return;}}
    if(/^plan\.items\.\w+\.start$/.test(k)&&v){const pid=k.split(".")[2];const ex=(((S.stores[id].plan||{}).items||{})[pid])||{};if(!ex.status){saveStore(id,{plan:{items:{[pid]:{start:v,status:"Đang thi công"}}}});return;}}
    if(/^plan\.mats\.\w+\.date$/.test(k)&&v){const pid=k.split(".")[2];saveStore(id,{plan:{mats:{[pid]:{date:v,status:"Đã cấp"}}}});return;}
    const patch=nest(k,v);
    const m=/^wf\.(\w+)\.(step|status|deadline|pic|link|result|note)$/.exec(k);
    if(m){const w=(S.stores[id].wf||{})[m[1]]||{};patch.wf[m[1]].updated=today();if(m[2]==="step"||m[2]==="status")patch.wf[m[1]].taskPct=null;
      if(m[2]==="step"&&v&&!w.status) patch.wf[m[1]].status="Đang thực hiện";
      if(m[2]==="status"&&v&&v!=="Không áp dụng"&&!w.step){const wf=cfg().workflows.find(x=>x.id===m[1]);if(wf&&wf.steps[0])patch.wf[m[1]].step=wf.steps[0].n;}}
    saveStore(id,patch);return;
  }
  if(el.id==="actPic"){S.actPic=el.value;render();return;}
  if(el.id==="importJson"&&el.files&&el.files[0]){importJson(el.files[0]);el.value="";return;}
  if(el.dataset.tp!=null){const t=S.cfgDraft.templates[+el.dataset.tp][el.dataset.tl][+el.dataset.ti],f=el.dataset.f;t[f]=f==="start"||f==="offset"?-Math.abs(Number(el.value)||0):f==="days"?Math.max(1,Number(el.value)||1):el.value;return;}
  if(el.dataset.cm!=null){const m=S.cfgDraft.manual[+el.dataset.cm];m[el.dataset.f]=el.dataset.f==="offset"?Number(el.value)||0:el.value;return;}
  if(el.dataset.cw!=null){const w=S.cfgDraft.workflows[+el.dataset.cw];w.steps=el.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf("|");return i>0?{n:l.slice(0,i).trim(),p:Math.max(0,Math.min(100,Number(l.slice(i+1))||0))}:{n:l,p:0};});return;}
});
